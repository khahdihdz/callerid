name: CallerID Android CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and lint
        run: gradle testDebugUnitTest lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: callerid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: test
    uses: khahdihdz/apksign/.github/workflows/android-shared-signing.yml@main
    with:
      project-dir: "."
      gradle-task: "assembleRelease"
      version-code: ${{ github.run_number }}
      version-name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-build.{0}', github.run_number) }}
    secrets: inherit

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            VERSION="0.1.0-build.${GITHUB_RUN_NUMBER}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download signed APK from apksign
        uses: actions/download-artifact@v4
        with:
          name: android-signed-apks
          path: release
      - name: Rename release APK
        shell: bash
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APK="$(find release -type f -name '*-signed.apk' -print -quit)"
          test -n "$APK"
          mv "$APK" "release/CallerID-${VERSION_TAG}-release.apk"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" release/*.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION_TAG" release/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "CallerID $VERSION_NAME" \
              --generate-notes
          fi
